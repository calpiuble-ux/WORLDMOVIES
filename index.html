<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>WORLDMOVIES</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0b0b0f;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 20px;
      background: #15151c;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-size: 26px;
      font-weight: bold;
    }

    .tagline {
      color: #aaa;
      margin-top: 5px;
    }

    .search {
      width: 100%;
      margin-top: 18px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #292932;
      color: white;
      font-size: 16px;
      outline: none;
    }

    h2 {
      padding: 0 20px;
      margin-top: 25px;
    }

    .movies {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      padding: 20px;
    }

    .movie {
      background: #18181f;
      border-radius: 10px;
      overflow: hidden;
    }

    .poster {
      height: 240px;
      background: #292932;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 55px;
    }

    .info {
      padding: 12px;
    }

    .title {
      font-size: 16px;
      font-weight: bold;
    }

    .rating {
      margin-top: 7px;
      color: #ffd700;
    }
  </style>
</head>

<body>

<header>

  <div class="logo">🎬 WORLDMOVIES</div>

  <div class="tagline">
    Discover movies from around the world
  </div>

  <input
    class="search"
    type="text"
    placeholder="Search movies..."
    onkeyup="searchMovies(this.value)"
  >

</header>

<h2>🔥 Popular Movies</h2>

<div class="movies" id="movieList"></div>

<script>

const movies = [
  {
    title: "Inception",
    rating: "8.8"
  },
  {
    title: "Interstellar",
    rating: "8.7"
  },
  {
    title: "The Dark Knight",
    rating: "9.0"
  },
  {
    title: "Avengers",
    rating: "8.0"
  },
  {
    title: "Spider-Man",
    rating: "8.2"
  },
  {
    title: "Avatar",
    rating: "7.8"
  }
];

function displayMovies(list) {

  const movieList = document.getElementById("movieList");

  movieList.innerHTML = "";

  list.forEach(movie => {

    movieList.innerHTML += `
      <div class="movie">

        <div class="poster">
          🎬
        </div>

        <div class="info">

          <div class="title">
            ${movie.title}
          </div>

          <div class="rating">
            ⭐ ${movie.rating}
          </div>

        </div>

      </div>
    `;

  });
}

function searchMovies(query) {

  const results = movies.filter(movie =>
    movie.title
      .toLowerCase()
      .includes(query.toLowerCase())
  );

  displayMovies(results);
}

displayMovies(movies);

</script>

</body>
</html>
